<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Seloss Store - Top up game, streaming premium, editing tools. Cepat, Simple, Tanpa Ribet!">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seloss Store">
  <meta name="keywords" content="top up, ML, free fire, netflix, spotify, canva, seloss, digital">
  <title>Seloss Store — Cepat • Simple • Tanpa Ribet</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=1.3.1">
</head>

<body>

<!-- ========================================================
     LOADING SCREEN
======================================================== -->
<div id="ls">
  <div class="ls-logo">Seloss Store</div>
  <div class="ls-tag">Cepat &bull; Simple &bull; Tanpa Ribet</div>
  <div class="ls-spin"></div>
</div>

<!-- ========================================================
     TOAST CONTAINER
======================================================== -->
<div id="tc"></div>

<!-- ========================================================
     AUTH SECTION
======================================================== -->
<div id="auth" style="display:none"></div>

<!-- ========================================================
     APP SECTION
======================================================== -->
<div id="app" style="display:none">
  <aside class="sb" id="sb">
    <div class="sb-brand">Seloss Store</div>
    <button class="sb-profile" id="sb-profile" onclick="R.go('profile')" aria-label="Edit profil">
      <span class="sb-avatar" id="sb-avatar"></span>
      <span class="sb-user-copy"><strong id="sb-user-name"></strong><small id="sb-user-role"></small></span>
      <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </button>
    <div class="sb-content">
      <div class="sb-admin-group" id="sb-admin-group" style="display:none">
        <div class="sb-label">ADMIN</div>
        <button class="sb-item" id="sbi-adm-dashboard" onclick="goAdmSub('dashboard')"><i class="bi bi-speedometer2 si" aria-hidden="true"></i><span>Dashboard</span></button>
        <button class="sb-item" id="sbi-adm-products" onclick="goAdmSub('products')"><i class="bi bi-box-seam si" aria-hidden="true"></i><span>Edit Produk</span></button>
        <button class="sb-item" id="sbi-adm-orders" onclick="goAdmSub('orders')"><i class="bi bi-receipt si" aria-hidden="true"></i><span>Pesanan</span></button>
        <button class="sb-item" id="sbi-adm-banners" onclick="goAdmSub('banners')"><i class="bi bi-images si" aria-hidden="true"></i><span>Edit Banner</span></button>
      </div>
      <div class="sb-label">MAIN MENU</div>
      <button class="sb-item" id="sbi-home" onclick="R.go('home')"><i class="bi bi-house si" aria-hidden="true"></i><span>Beranda</span></button>
      <button class="sb-item" id="sbi-hist" onclick="R.go('history')"><i class="bi bi-receipt si" aria-hidden="true"></i><span>Transaksi</span></button>
      <div class="sb-label">KATEGORI</div>
      <button class="sb-item category-item" data-category="semuaan" onclick="gocat('semuaan')"><span>Semuaan</span></button>
      <button class="sb-item category-item" data-category="larisann" onclick="gocat('larisann')"><span>Larisann</span></button>
      <button class="sb-item category-item" data-category="ngeditann" onclick="gocat('ngeditann')"><span>Ngeditann</span></button>
      <button class="sb-item category-item" data-category="streamingann" onclick="gocat('streamingann')"><span>Streamingann</span></button>
      <button class="sb-item category-item" data-category="ai-ann" onclick="gocat('ai-ann')"><span>AI-ann</span></button>
    </div>
    <div class="sb-footer">
      <button class="sb-item sb-logout" onclick="doLogout()"><i class="bi bi-box-arrow-left si" aria-hidden="true"></i><span>Logout</span></button>
    </div>
  </aside>
  <div class="sb-ov" id="sb-ov" onclick="closeSB()"></div>

  <div class="app-main">
    <header class="topbar">
      <button class="topbar-menu-toggle" onclick="tglSB()" aria-label="Buka menu"><i class="bi bi-list" aria-hidden="true"></i></button>
      <div class="topbar-search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input type="search" id="srch-inp" placeholder="Cari produk..." aria-label="Cari produk" oninput="handleSearch(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="topbar-actions">
        <details class="topbar-menu">
          <summary><i class="bi bi-gear" aria-hidden="true"></i><span>Pengaturan</span></summary>
          <div class="topbar-popover">Pengaturan belum tersedia.</div>
        </details>
        <details class="topbar-menu">
          <summary><i class="bi bi-headset" aria-hidden="true"></i><span>CS</span></summary>
          <div class="topbar-popover">Layanan customer service belum tersedia.</div>
        </details>
      </div>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/main.js?v=1.3.1"></script>
</body>
</html>
